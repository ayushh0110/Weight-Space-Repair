name: release

# Push a tag such as v0.1.0 to release. Before tagging:
#   1. set __version__ in src/wsr/__init__.py (pyproject.toml reads the version from there) and `version:` in
#      CITATION.cff to the same version, and add `date-released:` there;
#   2. give the release its own heading in CHANGELOG.md, with a real date: "## [0.1.0] - 2026-11-25".
# The run: the whole test suite -> build and check (with a smoke test of the wheel) -> PyPI -> GitHub Release
# with the CHANGELOG section as its notes.
# PyPI is reached through Trusted Publishing (OIDC): no API token is stored anywhere, and the
# PyPI action adds PEP 740 attestations by default.
# Actions are pinned by commit SHA (the tag is in the comment); Dependabot keeps both up to date.

on:
  push:
    tags: ["v*"]

permissions: {}     # nothing by default; each job asks for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    name: build and check
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist, then the wheel from the sdist
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: The tag, the version, the changelog, the citation and the wheel's files agree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          v_re="${version//./\\.}"
          ls -l dist
          test -f "dist/wsr-${version}-py3-none-any.whl" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ in src/wsr/__init__.py"; exit 1; }
          test -f "dist/wsr-${version}.tar.gz"
          grep -Eq "^## \[${v_re}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\s*$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs a heading '## [${version}] - YYYY-MM-DD' with the release date"; exit 1; }
          grep -Eq "^version: \"?${v_re}\"?\s*$" CITATION.cff \
            || { echo "::error::CITATION.cff says another version than ${version}"; exit 1; }
          python -m zipfile -l dist/*.whl > wheel-files.txt
          grep -q "wsr/known_issues.json" wheel-files.txt
          grep -q "wsr/deep/refusal_pools.jsonl" wheel-files.txt
      - name: The wheel installs and runs with no dependencies
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/wsr --version
          /tmp/smoke/bin/wsr triage --response examples/blank_reply/response.json \
            --request examples/blank_reply/request.json | tee /tmp/smoke-out.txt
          grep -q "VERDICT: REQUEST" /tmp/smoke-out.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi            # must match the environment on PyPI's trusted publisher; a required reviewer is optional
      url: https://pypi.org/p/wsr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and attach the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" '
            index($0, head) == 1     { found = 1; next }
            found && /^## \[/        { exit }
            found && /^\[[^]]+\]: /  { exit }
            found                    { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\nInstall: `pip install wsr==%s`\n' "$version" >> notes.md
          flags=""
          case "$version" in *[a-z]*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "wsr $GITHUB_REF_NAME" --notes-file notes.md $flags
