name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:        # release.yml runs the whole suite before it builds anything

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Triage and everything else that needs no dependencies. Tests that need torch skip themselves here.
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core, no dependencies, plus test tools)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -q -ra

  # Diagnosis, surgery, steering and wsr program on CPU torch, with the tiny models the tests build themselves.
  # The CUDA comparison test skips (no GPU on the runner).
  deep:
    name: deep (CPU torch, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install (deep extra, both agent SDKs, plus test tools)
        run: python -m pip install -e ".[dev,deep,yaml,agent,agent-openai]"
      - name: Tests
        run: python -m pytest -q -ra

  # The same on a Mac (Apple Silicon). GitHub's Macs have no usable GPU (they can even report MPS as available when it
  # is not), so this runs on CPU torch: it catches what differs on macOS itself. MPS's own code paths are tested with
  # stand-ins in tests/test_device.py; MPS on a real Mac is checked by scripts/check_mps.py (an "MPS report" issue).
  deep-macos:
    name: deep (macOS, CPU torch, Python 3.12)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install torch (the macOS wheel)
        run: python -m pip install torch
      - name: Install (deep extra, both agent SDKs, plus test tools)
        run: python -m pip install -e ".[dev,deep,yaml,agent,agent-openai]"
      - name: Tests
        run: python -m pytest -q -ra
