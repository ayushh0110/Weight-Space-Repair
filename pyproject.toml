[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsr"
dynamic = ["version"]          # from src/wsr/__init__.py (__version__), the one place it is set
description = "Weight-Space Repair: find out why an open-weight model failed, and fix it at the right level, from a setting to a verified weight edit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ayush" }]
keywords = ["llm", "debugging", "triage", "interpretability", "model-editing", "gguf", "safetensors", "llama.cpp",
            "ollama", "activation-steering", "weight-space-programming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
templates = ["jinja2>=3.1"]
modelvet = ["modelvet>=0.1.1"]
deep = ["torch>=2.2", "transformers>=4.56", "safetensors>=0.4", "numpy>=1.24", "psutil>=5.9"]
agent = ["anthropic>=0.101"]
agent-openai = ["openai>=1.40"]
data = ["huggingface_hub>=0.23", "pyarrow>=15"]      # wsr data fetch (gsm8k and mgsm are parquet)
yaml = ["pyyaml>=6"]                                 # goal files written as YAML
all = ["jinja2>=3.1", "modelvet>=0.1.1", "torch>=2.2", "transformers>=4.56", "safetensors>=0.4", "numpy>=1.24",
       "psutil>=5.9", "huggingface_hub>=0.23", "pyarrow>=15", "pyyaml>=6"]
dev = ["pytest>=8", "ruff>=0.5", "jinja2>=3.1"]

[project.urls]
Repository = "https://github.com/ayushh0110/Weight-Space-Repair"
Issues = "https://github.com/ayushh0110/Weight-Space-Repair/issues"
Documentation = "https://github.com/ayushh0110/Weight-Space-Repair/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/ayushh0110/Weight-Space-Repair/blob/main/CHANGELOG.md"

[project.scripts]
wsr = "wsr.cli:main"

[tool.hatch.version]
path = "src/wsr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wsr"]

[tool.hatch.build.targets.sdist]
# Source, tests, docs and examples; not the repository's CI and funding files (launch/ is in .gitignore).
exclude = ["/.github"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Long lines are wrapped by hand at 120; the ones left are tables, URLs and messages that read better whole.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
