[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsr-triage"
version = "0.1.0"
description = "Triage layer of the Weight-Space Repair CLI: find out why a model failed, and say how to fix it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
templates = ["jinja2>=3.1"]
modelvet = ["modelvet>=0.1.1"]
deep = ["torch>=2.2", "transformers>=4.45", "safetensors>=0.4", "numpy>=1.24"]
agent = ["anthropic>=0.101"]
agent-openai = ["openai>=1.40"]
all = ["jinja2>=3.1", "modelvet>=0.1.1", "torch>=2.2", "transformers>=4.45", "safetensors>=0.4", "numpy>=1.24"]
dev = ["pytest>=8", "jinja2>=3.1"]

[project.scripts]
wsr = "wsr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
